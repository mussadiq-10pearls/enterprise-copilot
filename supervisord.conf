[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/fastapi.err.log
stdout_logfile=/tmp/fastapi.out.log

[program:gradio]
command=python gradio_ui.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/gradio.err.log
stdout_logfile=/tmp/gradio.out.log